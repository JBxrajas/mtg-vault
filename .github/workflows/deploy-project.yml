name: deploy-project

# Reusable: deploys one Vercel project to production and checks that it answers. Called by deploy-web.yml and
# deploy-api.yml, which decide *when* (only when something the project uses changed). See ADR 0012.
on:
  workflow_call:
    inputs:
      project:
        description: Short name, for the logs
        required: true
        type: string
      project-id:
        description: Vercel project id (not a secret)
        required: true
        type: string
      check-url:
        description: URL that must answer 200 after the deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ahw8LZkDfwoj0kRt1X2iMGD4
      VERCEL_PROJECT_ID: ${{ inputs.project-id }}
    steps:
      - name: Check the token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The VERCEL_TOKEN secret is not set, so nothing was deployed. Create a token at https://vercel.com/account/tokens and run: gh secret set VERCEL_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The project's root directory is a Vercel project setting (apps/web, apps/api), so it is deployed from the
      # repository root. Vercel installs and builds remotely; nothing is built here.
      - name: Deploy to production
        run: npx --yes vercel@65.11.0 deploy --prod --yes

      - name: Check that it answers
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "${{ inputs.check-url }}" > /dev/null
