name: deploy-api

# Production deploy of the API. Same rules as deploy-web.yml: Vercel's Git deployments are off and this runs only
# when something the API uses changed (its own code, the shared and db packages, the lockfile). See ADR 0012.
on:
  push:
    branches: [main]
    paths:
      - apps/api/src/**
      - apps/api/tsconfig.json
      - apps/api/tsup.config.ts
      - apps/api/vercel.json
      - packages/shared/src/**
      - packages/db/src/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml
      - .github/workflows/deploy-project.yml
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-project.yml
    secrets: inherit
    with:
      project: api
      project-id: prj_WB1suQxagMdSaplXuG5MfLDoMSQx
      check-url: https://mtg-vault-api.vercel.app/health
